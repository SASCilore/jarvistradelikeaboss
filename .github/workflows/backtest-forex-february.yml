name: Run Forex Backtest February 2026

on:
  workflow_dispatch:

jobs:
  backtest-february:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install trading-ig munch

      - name: Lancer le backtest février 2026
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
        run: python main_forex_february.py

      - name: Sauvegarder les résultats
        uses: actions/upload-artifact@v4
        with:
          name: february-backtest-results
          path: |
            results/dashboard_february.png
            results/trades_february.csv
            results/equity_february.csv
          retention-days: 14
