name: Run Trading Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: DEBUG - Vérifier les secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TOKEN: VIDE/ABSENT"; else echo "TOKEN: présent, longueur ${#TELEGRAM_BOT_TOKEN} caractères"; fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then echo "CHAT_ID: VIDE/ABSENT"; else echo "CHAT_ID: présent = $TELEGRAM_CHAT_ID"; fi

      - name: Lancer le bot (un cycle)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python live_run.py

      - name: Committer l'état mis à jour
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state/
          git diff --quiet --cached || git commit -m "Mise à jour état du bot [skip ci]"
          git push
