name: Run Backtest

on:
  workflow_dispatch:
    # Se lance uniquement à la demande (bouton "Run workflow"), jamais automatiquement.

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le backtest complet
        run: python main.py

      - name: Sauvegarder les résultats (visibles/téléchargeables depuis le mobile)
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            results/dashboard.png
            results/trades.csv
            results/equity_curve.csv
          retention-days: 14
