name: Run Forex Backtest

on:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour committer les données récupérées dans le repo

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install trading-ig munch

      - name: Lancer le backtest forex
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
        run: python main_forex.py

      - name: Sauvegarder les résultats
        uses: actions/upload-artifact@v4
        with:
          name: forex-backtest-results
          path: |
            results/dashboard_forex.png
            results/trades_forex.csv
            results/equity_curve_forex.csv
          retention-days: 14

      - name: Committer les données brutes récupérées (pour analyse sans re-consommer le quota IG)
        run: |
          git config user.name "forex-backtest"
          git config user.email "forex-backtest@users.noreply.github.com"
          git add -f data/eurusd_history.csv
          git diff --quiet --cached || git commit -m "Données EUR/USD récupérées [skip ci]"
          git push
